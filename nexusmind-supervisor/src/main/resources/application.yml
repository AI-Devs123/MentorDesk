spring:
  application:
    name: nexusmind-supervisor
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    connect-timeout: 1s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms

server:
  port: 8081
  servlet:
    context-path: /

dubbo:
  application:
    name: nexusmind-supervisor
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: tri
    port: 50051
  provider:
    filter: destructiveOperationDubboFilter,agentRbacDubboFilter