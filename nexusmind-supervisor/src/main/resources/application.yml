spring:
  application:
    name: nexusmind-supervisor
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    connect-timeout: 1s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms

server:
  port: 8081
  servlet:
    context-path: /

dubbo:
  application:
    name: nexusmind-supervisor
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: tri
    port: 50051
  provider:
    filter: destructiveOperationDubboFilter,agentRbacDubboFilter

# 说明：llm.* 配置已移至 nexusmind-agent-workers/src/main/resources/application.yml
# （读取方 LLMClient 属于 agent-workers 模块，配置应与实现同模块）。
# 当前 journal 链路通过本地 @Autowired 注入在 supervisor 进程内执行 LLMClient，
# 未配置时使用 @Value 默认值（api-key 为空 → 自动降级 Mock，与 sk-test 行为一致）。
# 日记落盘基准目录由 SandboxPathValidator 硬编码为 data/nexusmind/sandbox/journals
# （相对于进程工作目录），此处同样不配置 storage-path，避免死配置。