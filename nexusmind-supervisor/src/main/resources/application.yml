spring:
  application:
    name: nexusmind-supervisor
  redis:
    host: localhost
    port: 6379
    timeout: 3000ms
    connect-timeout: 1s
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms

server:
  port: 8081
  servlet:
    context-path: /

dubbo:
  application:
    name: nexusmind-supervisor
    qos-enable: false
  # 切片 2：开启 Dubbo Triple 指标（本服务为 provider，暴露 qps/rt/error 到 /actuator/prometheus）。
  metrics:
    enabled: true
  registry:
    address: nacos://localhost:8848
  protocol:
    name: tri
    port: 50051
  provider:
    filter: destructiveOperationDubboFilter,agentRbacDubboFilter

# 说明：llm.* 配置已移至 nexusmind-agent-workers/src/main/resources/application.yml
# （读取方 LLMClient 属于 agent-workers 模块，配置应与实现同模块）。
# 当前 journal 链路通过本地 @Autowired 注入在 supervisor 进程内执行 LLMClient，
# 未配置时使用 @Value 默认值（api-key 为空 → 自动降级 Mock，与 sk-test 行为一致）。
# 日记落盘基准目录由 SandboxPathValidator 硬编码为 data/nexusmind/sandbox/journals
# （相对于进程工作目录），此处同样不配置 storage-path，避免死配置。

# 切片 3：Langfuse 在线可观测（AOP 切面驱动，零外部 SDK 依赖）。
# 默认关闭——只有显式 enabled:true 且 host 非空才真实上报 HTTP，否则 NoOp 降级，业务零侵入。
observability:
  langfuse:
    enabled: ${OBS_LANGFUSE_ENABLED:false}
    host: ${OBS_LANGFUSE_HOST:}
    public-key: ${OBS_LANGFUSE_PUBLIC_KEY:}
    secret-key: ${OBS_LANGFUSE_SECRET_KEY:}

# 切片 1 可观测性基座：暴露 Prometheus 抓取端点（/actuator/prometheus）。
# 本服务为 servlet（spring-boot-starter-web），SecurityConfig 已对 /actuator/prometheus 放行。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# 切片 3：Sentinel 接入层限流/熔断（仅 sentinel-core，自研 jakarta Filter 接入）。
sentinel:
  enabled: true
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs
  flow-rules:
    - resource: "POST:/api/v1/journal/review"
      count: 20
      grade: 1
  degrade-rules:
    # 保护跨进程 Dubbo 下游（agent-workers 的 journalReviewService）：
    # 当调用异常比例超 50%（近 10s 内至少 5 次请求），熔断 5s 走降级，
    # 避免下游 agent-workers 故障被持续打满造成雪崩。
    - resource: "downstream:journalReviewService"
      grade: 1
      count: 0.5
      min-request-amount: 5
      stat-interval-ms: 10000
      time-window-ms: 5000