spring:
  application:
    name: nexusmind-supervisor
  profiles:
    active: dev
  config:
    import:
      - optional:nacos:nexusmind-supervisor-dev.yaml
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        file-extension: yaml
        group: DEFAULT_GROUP
        namespace: 8a7c1b01-nexusmind-dev-001  # 此处填 dev 命名空间的真实 Namespace ID
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: 8a7c1b01-nexusmind-dev-001