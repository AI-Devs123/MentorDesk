server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nexusmind-gateway
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

dubbo:
  application:
    name: nexusmind-gateway
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  consumer:
    timeout: 120000
    check: false
  # gateway 虽为纯 consumer，Dubbo 3 启动时仍会导出内建元数据服务并绑定协议端口。
  # 三服务端口各有专职，避免互撞（此前 port:-1 回退默认 50051，与 supervisor 冲突）：
  #   supervisor 50051 / agent-workers 50052 / gateway 50053
  protocol:
    name: tri
    port: 50053

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN

# 切片 1 可观测性基座：暴露 Prometheus 抓取端点（/actuator/prometheus）。
# 网关为 WebFlux，SecurityConfig 是 servlet 过滤器对本上下文不生效，故 /actuator/prometheus 天然可达；
# 安全收敛交由上层网关切面 / 内网隔离，此处不做鉴权（与 /actuator/health 同策略）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}