server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nexusmind-gateway
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

dubbo:
  application:
    name: nexusmind-gateway
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  consumer:
    timeout: 120000
    check: false
  protocol:
    name: tri
    port: -1  # 消费者不需要协议端口

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN