server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nexusmind-gateway

dubbo:
  application:
    name: nexusmind-gateway
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  consumer:
    timeout: 120000
    check: false
  protocol:
    name: tri
    port: -1  # 消费者不需要协议端口

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN