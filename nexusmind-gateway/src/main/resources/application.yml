server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: nexusmind-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

dubbo:
  application:
    name: nexusmind-gateway
    qos-enable: false
  # 切片 2：开启 Dubbo Triple 指标（provider/consumer 的 qps/rt/error），
  # 经 micrometer 进入 nexusmind-gateway 的 /actuator/prometheus 由 Prometheus 抓取。
  metrics:
    enabled: true
  registry:
    address: nacos://localhost:8848
  consumer:
    timeout: 120000
    check: false
    cluster: failover
    retries: 1
  # gateway 虽为纯 consumer，Dubbo 3 启动时仍会导出内建元数据服务并绑定协议端口。
  # 三服务端口各有专职，避免互撞（此前 port:-1 回退默认 50051，与 supervisor 冲突）：
  #   supervisor 50051 / agent-workers 50052 / gateway 50053
  protocol:
    name: tri
    port: 50053

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN

# 切片 1 可观测性基座：暴露 Prometheus 抓取端点（/actuator/prometheus）。
# 网关为 WebFlux，SecurityConfig 是 servlet 过滤器对本上下文不生效，故 /actuator/prometheus 天然可达；
# 安全收敛交由上层网关切面 / 内网隔离，此处不做鉴权（与 /actuator/health 同策略）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 切片 3：Sentinel 接入层限流/熔断（仅 sentinel-core，自研 WebFlux WebFilter 接入）。
# 网关作为最前端，对核心路由做 QPS 限流，防止突发流量打垮下游（supervisor/agent）。
# 熔断资源（downstream:*）为网关→supervisor 下游预留，规则已就绪，待真实跨进程调用后生效。
sentinel:
  enabled: true
  excluded-paths:
    - /actuator
    - /swagger-ui
    - /v3/api-docs
    - /health
    - /api/v1/health
  flow-rules:
    - resource: "GET:/api/v1/agent"
      count: 50
      grade: 1
    - resource: "POST:/api/v1/journal/review"
      count: 20
      grade: 1
    - resource: "GET:/api/v1/search"
      count: 30
      grade: 1
  degrade-rules:
    - resource: "downstream:supervisor"
      grade: 1
      count: 0.5
      min-request-amount: 10
      stat-interval-ms: 10000
      time-window-ms: 5000