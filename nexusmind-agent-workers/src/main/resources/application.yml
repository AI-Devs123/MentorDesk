spring:
  application:
    name: nexusmind-agent-workers

server:
  port: 8082

dubbo:
  application:
    name: nexusmind-agent-workers
    qos-enable: false
  # 切片 2：开启 Dubbo Triple 指标。agent-workers 为 non-web，指标经 PushGateway 外推。
  metrics:
    enabled: true
  registry:
    address: nacos://localhost:8848
  protocol:
    name: tri
    port: 50052

# LLM 配置（读取方为本模块的 com.nexusmind.agent.llm.LLMClient，@Value 注入）
# 注意：api-key 为 sk-test 或空时 LLMClient 自动降级为 Mock 响应，不发起真实网络调用
# base-url 支持任意 OpenAI 兼容端点（通义千问/DeepSeek/Ollama 等），切换无需改码
llm:
  api-key: ${LLM_API_KEY:sk-test}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: 5
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN

# 切片 3：LLMClient 的 Langfuse 在线可观测（零外部 SDK 依赖，@Value 本地构建，非 @Autowired）。
# 默认关闭——enabled:false 或 host 为空时 LLMClient 内部使用 NoOpLfTracingClient，绝不发起上报。
observability:
  langfuse:
    enabled: ${OBS_LANGFUSE_ENABLED:false}
    host: ${OBS_LANGFUSE_HOST:}
    public-key: ${OBS_LANGFUSE_PUBLIC_KEY:}
    secret-key: ${OBS_LANGFUSE_SECRET_KEY:}

# 切片 1 可观测性基座：指标公共标签（application）；non-web 模块经 PushGateway 外推。
management:
  metrics:
    tags:
      application: ${spring.application.name}

# 切片 1：non-web 模块指标外推配置（默认关闭，见 MetricsPushConfig）
nexusmind:
  metrics:
    push:
      enabled: ${NEXUSMIND_PUSH_ENABLED:false}
      gateway: ${NEXUSMIND_PUSH_GATEWAY:localhost:9091}
      job: ${spring.application.name}
      step-millis: 60000
