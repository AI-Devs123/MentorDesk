spring:
  application:
    name: nexusmind-agent-workers

server:
  port: 8082

dubbo:
  application:
    name: nexusmind-agent-workers
    qos-enable: false
  registry:
    address: nacos://localhost:8848
  protocol:
    name: tri
    port: 50052

logging:
  level:
    root: INFO
    com.nexusmind: DEBUG
    org.apache.dubbo: WARN
