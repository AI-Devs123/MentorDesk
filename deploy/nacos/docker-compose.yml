services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nexusmind-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./data:/home/nacos/data
      - ./logs:/home/nacos/logs
    restart: always