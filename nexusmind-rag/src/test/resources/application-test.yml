nexusmind:
  rag:
    index-dir: target/nexusmind-rag-test-indices
  # 测试环境不加载 300MB 模型：关闭精排总开关，直接验证纯 RRF 降级路径
  rerank:
    enabled: false
  embedding:
    mock: true

# 测试环境不连 Nacos：registry 置 N/A + 关闭注册/订阅。
# @DubboService 仍会注册为 Spring Bean（供 @Autowired IHybridSearchService 进程内直调），
# 仅不向注册中心导出。
# 端口固定 20880（Dubbo 默认安全区间，避开 Windows 排除区间 50000-50059 / 52041-52140）。
# 各 @SpringBootTest(RagApplication.class) 测试类均已加 @DirtiesContext(AFTER_CLASS)：
# 因 @EnableDubbo 会让每个上下文都导出同一 IHybridSearchService:1.0.0，
# 同 JVM 内多个独立上下文会触发 TripleProtocol 的「serviceKey 已存在」冲突，
# 故每类跑完即销毁上下文、释放 Dubbo 导出，下一类再重建。
dubbo:
  registry:
    address: N/A
    register: false
    subscribe: false
    check: false
  protocol:
    name: tri
    port: 20880

