spring:
  application:
    name: nexusmind-rag
  main:
    web-application-type: none

nexusmind:
  rag:
    # 索引根目录（相对路径仅用于本地默认；生产应改为绝对/受管数据卷路径）
    index-dir: ./data/lucene_indices
  rerank:
    # 总开关：false 时连文件都不加载，直接走纯 RRF 快路径（系统永不阻断）
    enabled: true
    # INT8 量化 Cross-Encoder（约 300MB）。生产务必改为受管数据卷绝对路径
    model-path: ./models/bge-reranker-large-quantized.onnx
    vocab-path: ./models/vocab.txt
    # 最大序列长度：限制 CPU 算力与 native 内存穿透
    max-seq-len: 256
  embedding:
    # 兼容 OpenAI 规范的 /v1/embeddings 端点；留空则通道禁用
    base-url: ""
    api-key: ""
    model: bge-small-zh-v1.5
    # 显式开启后才允许无端点时的确定性伪向量降级（仅测试/演示用）
    mock: false
  # 切片 1 可观测性：non-web 模块指标外推配置（默认关闭，见 MetricsPushConfig）
  metrics:
    push:
      enabled: ${NEXUSMIND_PUSH_ENABLED:false}
      gateway: ${NEXUSMIND_PUSH_GATEWAY:localhost:9091}
      job: ${spring.application.name}
      step-millis: 60000

dubbo:
  application:
    name: nexusmind-rag
    qos-enable: false
  # 切片 2：开启 Dubbo Triple 指标。rag 为 non-web，指标经 PushGateway 外推（nexusmind.metrics.push.*）。
  metrics:
    enabled: true
  registry:
    address: nacos://localhost:8848
  # 三服务端口各有专职，避免互撞：
  #   supervisor 50051 / agent-workers 50052 / gateway 50053 / rag 50054
  protocol:
    name: tri
    port: 50054

# 切片 1 可观测性基座：指标公共标签（application），便于在 Prometheus 中按服务区分。
# rag 为 non-web（web-application-type: none），不暴露 /actuator/prometheus，指标经 PushGateway 外推。
management:
  metrics:
    tags:
      application: ${spring.application.name}
